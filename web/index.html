<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path d='M12 2.5c.6 3.2-1.4 4.9-2.9 6.6C7.6 10.8 6.5 12.6 6.5 15a5.5 5.5 0 0 0 11 0c0-2.1-.9-3.7-2-5 .1 1.6-.5 2.8-1.6 3.4.4-3.5-.6-7.6-1.9-10.9Z' fill='%23f97316'/><path d='M12 21a2.9 2.9 0 0 1-2.9-2.9c0-1.6 1.1-2.6 2-3.6.3 1 .9 1.6 1.7 1.9.2-.9.6-1.6 1.2-2.2.6.9 1 1.9 1 3A2.9 2.9 0 0 1 12 21Z' fill='%23fde68a'/></svg>" />
    <title>Ватра</title>
    <script>
      // Guess the UI language before the app loads (same rule as App.tsx) to avoid a flash.
      (function () {
        var l;
        try { l = localStorage.getItem('vatra-lang'); } catch (e) {}
        if (l !== 'uk' && l !== 'en') l = /^(uk|ru)\b/i.test(navigator.language || '') ? 'uk' : 'en';
        document.documentElement.lang = l;
        if (l === 'en') document.title = 'Vatra';
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
